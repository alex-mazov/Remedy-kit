name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: remedy
          POSTGRES_PASSWORD: remedy
          POSTGRES_DB: remedy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U remedy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://remedy:remedy@localhost:5432/remedy_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Chromium for the end-to-end OAuth test (virtual passkey authenticator).
      - run: pnpm exec playwright-core install --with-deps chromium
      - run: pnpm test
